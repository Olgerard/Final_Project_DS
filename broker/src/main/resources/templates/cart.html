<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Review Order</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        td, th { padding: 10px 14px; border: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; }
        .actions { margin-top: 20px; display: flex; gap: 14px; }
        .btn { padding: 12px 28px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #45a049; }
        .btn-back { padding: 12px 28px; background: #aaa; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; text-decoration: none; }
        .btn-back:hover { background: #999; }
    </style>
</head>
<body>
    <h1>Review Your Order</h1>

    <table>
        <tr><th>Field</th><th>Value</th></tr>
        <tr><td>Customer Name</td><td th:text="${customerName}"></td></tr>
        <tr><td>Quantity</td><td th:text="${quantity}"></td></tr>
        <tr><td>Ticket ID</td><td th:text="${ticketId}"></td></tr>
        <tr><td>Accommodation ID</td><td th:text="${accommodationId}"></td></tr>
        <tr><td>Transport ID</td><td th:text="${transportId}"></td></tr>
        <tr><td>Payment Info</td><td th:text="${paymentInfo}"></td></tr>
    </table>

    <form th:action="@{/order}" method="post">
        <input type="hidden" name="eventId" th:value="${eventId}"/>
        <input type="hidden" name="ticketId" th:value="${ticketId}"/>
        <input type="hidden" name="accommodationId" th:value="${accommodationId}"/>
        <input type="hidden" name="transportId" th:value="${transportId}"/>
        <input type="hidden" name="quantity" th:value="${quantity}"/>
        <input type="hidden" name="customerName" th:value="${customerName}"/>
        <input type="hidden" name="paymentInfo" th:value="${paymentInfo}"/>

        <div class="actions">
            <a class="btn-back" th:href="@{/event/{id}(id=${eventId})}">← Go Back</a>
            <button class="btn" type="submit">Confirm &amp; Book</button>
        </div>
    </form>
</body>
</html>
