<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Manager Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px 14px; border: 1px solid #ddd; text-align: left; }
        th { background: #f5f5f5; font-weight: bold; }
        tr:hover { background: #fafafa; }
        .confirmed { color: #4CAF50; font-weight: bold; }
        .cancelled { color: #e53935; font-weight: bold; }
        .reserved { color: #FF9800; font-weight: bold; }
        nav { display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #555; text-decoration: none; padding: 8px 16px; border: 1px solid #ccc; border-radius: 4px; }
        nav a:hover { background: #f5f5f5; }
        .empty { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <nav>
        <h1>Manager Dashboard</h1>
        <a th:href="@{/logout}">Logout</a>
    </nav>

    <p th:if="${#lists.isEmpty(orders)}" class="empty">No orders yet.</p>

    <table th:if="${!#lists.isEmpty(orders)}">
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Event ID</th>
                <th>Ticket ID</th>
                <th>Accommodation ID</th>
                <th>Transport ID</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.orderId}"></td>
                <td th:text="${order.customerName}"></td>
                <td th:text="${order.eventId}"></td>
                <td th:text="${order.ticketId}"></td>
                <td th:text="${order.accommodationId}"></td>
                <td th:text="${order.transportId}"></td>
                <td th:text="${order.quantity}"></td>
                <td>
                    <span th:class="${order.status.name() == 'CONFIRMED'} ? 'confirmed' : (${order.status.name() == 'CANCELLED'} ? 'cancelled' : 'reserved')"
                          th:text="${order.status}"></span>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
