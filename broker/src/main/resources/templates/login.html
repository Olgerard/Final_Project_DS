<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manager Login — EventHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f4f6fb; display: flex; flex-direction: column; min-height: 100vh; }

        nav { background: #1a1a2e; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .nav-logo { color: white; font-size: 22px; font-weight: 700; }
        .nav-logo span { color: #a78bfa; }
        .nav-back { color: #cbd5e1; text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-back:hover { color: white; }

        .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }

        .box { background: white; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
        .box-icon { text-align: center; font-size: 40px; margin-bottom: 16px; }
        .box-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 4px; }
        .box-sub { font-size: 14px; color: #6b7280; text-align: center; margin-bottom: 28px; }

        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .field input { width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
        .field input:focus { outline: none; border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }

        .btn { width: 100%; padding: 12px; background: #7c3aed; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; transition: background 0.2s; }
        .btn:hover { background: #6d28d9; }

        .error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo">Event<span>Hub</span></div>
    <a class="nav-back" href="/">← Back to homepage</a>
</nav>

<div class="page">
    <div class="box">
        <div class="box-icon">🔐</div>
        <div class="box-title">Manager Portal</div>
        <div class="box-sub">Sign in to access the order dashboard</div>

        <div class="error" th:if="${param.error}">
            Invalid username or password. Please try again.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required/>
            </div>
            <button class="btn" type="submit">Sign In →</button>
        </form>
    </div>
</div>

</body>
</html>
