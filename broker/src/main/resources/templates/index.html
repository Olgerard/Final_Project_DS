<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Event Organizer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #333; }
        .events { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; width: 250px; box-shadow: 2px 2px 6px rgba(0,0,0,0.1); }
        .card h2 { margin-top: 0; color: #444; }
        .card p { color: #666; margin: 4px 0; }
        .btn { display: inline-block; margin-top: 14px; padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px; }
        .btn:hover { background: #45a049; }
        nav { text-align: right; margin-bottom: 20px; }
        nav a { color: #555; text-decoration: none; margin-left: 15px; }
    </style>
</head>
<body>
    <nav>
        <a th:href="@{/manager}">Manager</a>
    </nav>
    <h1>Event Organizer</h1>
    <p>Book your tickets, accommodation, and transport in one go.</p>

    <div class="events">
        <div class="card" th:each="event : ${events}">
            <h2 th:text="${event['name']}">Event Name</h2>
            <p th:text="${event['location']}">Location</p>
            <p th:text="${event['date']}">Date</p>
            <a class="btn" th:href="@{/event/{id}(id=${event['id']})}">Book Now</a>
        </div>
    </div>
</body>
</html>
