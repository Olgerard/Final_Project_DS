spring.application.name=broker
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:brokerdb
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop

# Supplier base URLs
supplier.accommodation.url=http://localhost:8081
supplier.ticket.url=http://localhost:8082
supplier.transport.url=http://localhost:8083

# Manager account
spring.security.user.name=manager
spring.security.user.password=manager123
spring.security.user.roles=MANAGER
