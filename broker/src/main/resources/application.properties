spring.application.name=broker
server.port=8080

# Database
spring.datasource.url=jdbc:sqlserver://event-broker.database.windows.net:1433;database=broker-db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30

